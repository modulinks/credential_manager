<h2>Gestor de Credenciales</h2>
<p>Este módulo permite gestionar credenciales de forma segura al estilo Bitwarden, directamente en Odoo 16.</p>
<ul>
  <li>Almacena accesos con cifrado y control de permisos</li>
  <li>Diseño simplificado para uso interno de equipos técnicos</li>
  <li>Compatible con Community y Enterprise</li>
</ul>
