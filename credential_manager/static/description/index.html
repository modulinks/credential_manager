<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Credenciales - Odoo Addon</title>
    <style>
        /* Resetear estilos de Odoo */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #f8f9fa !important;
            color: #333 !important;
        }
        
        .container {
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 20px !important;
            background: #f8f9fa !important;
        }
        
        .image-gallery {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 30px !important;
            max-width: 1000px !important;
            margin: 0 auto !important;
        }
        
        .image-item {
            width: 100% !important;
            max-width: 900px !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12) !important;
            overflow: hidden !important;
            background: white !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease !important;
        }
        
        .image-item:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18) !important;
        }
        
        .image-item img {
            width: 100% !important;
            height: auto !important;
            display: block !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* Responsive para móviles */
        @media (max-width: 768px) {
            .container {
                padding: 10px !important;
            }
            
            .image-gallery {
                gap: 20px !important;
            }
            
            .image-item {
                border-radius: 8px !important;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1) !important;
            }
            
            .image-item:hover {
                transform: none !important;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15) !important;
            }
        }
        
        /* Estilos específicos para cada imagen si necesitas variaciones */
        .image-item:nth-child(1) {
            border-top: 4px solid #2c5aa0 !important;
        }
        
        .image-item:nth-child(2) {
            border-top: 4px solid #28a745 !important;
        }
        
        .image-item:nth-child(3) {
            border-top: 4px solid #17a2b8 !important;
        }
        
        .image-item:nth-child(4) {
            border-top: 4px solid #ffc107 !important;
        }
        
        .image-item:nth-child(5) {
            border-top: 4px solid #dc3545 !important;
        }
        
        .image-item:nth-child(6) {
            border-top: 4px solid #6f42c1 !important;
        }
        
        .image-item:nth-child(7) {
            border-top: 4px solid #fd7e14 !important;
        }
        
        /* Remover cualquier estilo conflictivo de Odoo */
        * {
            box-sizing: border-box !important;
        }
        
        /* Asegurar que las imágenes se carguen correctamente */
        img {
            max-width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-gallery">
            <div class="image-item">
                <img src="picture1.png" alt="Credential Manager - Image 1" loading="lazy">
            </div>
            
            <div class="image-item">
                <img src="picture2.png" alt="Credential Manager - Image 2" loading="lazy">
            </div>
            
            <div class="image-item">
                <img src="picture3.png" alt="Credential Manager - Image 3" loading="lazy">
            </div>
            
            <div class="image-item">
                <img src="picture4.png" alt="Credential Manager - Image 4" loading="lazy">
            </div>
            
            <div class="image-item">
                <img src="picture5.png" alt="Credential Manager - Image 5" loading="lazy">
            </div>
            
            <div class="image-item">
                <img src="picture6.png" alt="Credential Manager - Image 6" loading="lazy">
            </div>
        
        </div>
    </div>
</body>
</html>
