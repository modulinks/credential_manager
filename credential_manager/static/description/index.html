<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Credenciales - Odoo Addon</title>
    <style>
        /* Asegurar compatibilidad con Odoo */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            color: #333;
        }

        /* Contenedor principal compatible con Odoo */
        .oe_credential_manager_container {
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
        }

        /* Galería de imágenes */
        .oe_image_gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Separación mínima de 3px, ajustada para estética */
            max-width: 100%;
            margin: 0 auto;
        }

        /* Elemento de imagen */
        .oe_image_item {
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08); /* Sombra ligera y suave */
            overflow: hidden;
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .oe_image_item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12); /* Sombra suave en hover */
        }

        /* Imágenes responsivas con Bootstrap */
        .oe_image_item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            aspect-ratio: 16 / 9; /* Ajusta según tus imágenes */
            display: block;
            border: none;
            margin: 0;
            padding: 0;
            max-width: 100%;
        }

        /* Colores distintivos para cada imagen */
        .oe_image_item:nth-child(1) { border-top: 4px solid #2c5aa0; }
        .oe_image_item:nth-child(2) { border-top: 4px solid #28a745; }
        .oe_image_item:nth-child(3) { border-top: 4px solid #17a2b8; }
        .oe_image_item:nth-child(4) { border-top: 4px solid #ffc107; }
        .oe_image_item:nth-child(5) { border-top: 4px solid #dc3545; }
        .oe_image_item:nth-child(6) { border-top: 4px solid #6f42c1; }

        /* Responsive para tablets (Bootstrap md) */
        @media (max-width: 991px) {
            .oe_credential_manager_container {
                padding: 15px;
            }
            .oe_image_gallery {
                gap: 15px; /* Separación mínima de 3px, ajustada */
                max-width: 95%;
            }
            .oe_image_item {
                max-width: 100%;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            }
        }

        /* Responsive para móviles (Bootstrap sm) */
        @media (max-width: 767px) {
            .oe_credential_manager_container {
                padding: 10px;
            }
            .oe_image_gallery {
                gap: 10px; /* Separación mínima de 3px, ajustada */
            }
            .oe_image_item {
                border-radius: 6px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); /* Sombra más ligera en móviles */
            }
            .oe_image_item:hover {
                transform: none; /* Desactiva hover en móviles */
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            }
            .oe_image_item img {
                max-height: 250px; /* Limita altura en móviles */
            }
        }

        /* Ultra pequeñas pantallas (Bootstrap xs) */
        @media (max-width: 575px) {
            .oe_image_gallery {
                gap: 8px; /* Separación mínima de 3px, ajustada */
            }
            .oe_image_item img {
                max-height: 200px; /* Más pequeño para pantallas pequeñas */
            }
        }

        /* Asegurar box-sizing */
        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="oe_credential_manager_container container">
        <div class="oe_image_gallery">
            <div class="oe_image_item">
                <img src="picture1.png" alt="Credential Manager - Image 1" class="img-fluid" loading="lazy">
            </div>
            <div class="oe_image_item">
                <img src="picture2.png" alt="Credential Manager - Image 2" class="img-fluid" loading="lazy">
            </div>
            <div class="oe_image_item">
                <img src="picture3.png" alt="Credential Manager - Image 3" class="img-fluid" loading="lazy">
            </div>
            <div class="oe_image_item">
                <img src="picture4.png" alt="Credential Manager - Image 4" class="img-fluid" loading="lazy">
            </div>
            <div class="oe_image_item">
                <img src="picture5.png" alt="Credential Manager - Image 5" class="img-fluid" loading="lazy">
            </div>
            <div class="oe_image_item">
                <img src="picture6.png" alt="Credential Manager - Image 6" class="img-fluid" loading="lazy">
            </div>
        </div>
    </div>
</body>
</html>
